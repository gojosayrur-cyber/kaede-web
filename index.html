<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kaede's Funny World 🐱</title>
  <style>
    body {
      font-family: 'Comic Sans MS', cursive, sans-serif;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      margin: 0;
      padding: 20px;
      color: #333;
      text-align: center;
    }
    h1 {
      color: #ff6b6b;
      font-size: 3em;
      text-shadow: 3px 3px 0 #fff;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 15px;
      max-width: 1200px;
      margin: 30px auto;
    }
    .gallery img {
      width: 100%;
      border-radius: 20px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.2);
      transition: transform 0.3s;
    }
    .gallery img:hover {
      transform: scale(1.1) rotate(3deg);
    }
    .message {
      background: white;
      margin: 30px auto;
      padding: 25px;
      border-radius: 30px;
      max-width: 600px;
      box-shadow: 0 15px 30px rgba(0,0,0,0.15);
    }
    button {
      background: #ff6b6b;
      color: white;
      border: none;
      padding: 15px 30px;
      font-size: 1.3em;
      border-radius: 50px;
      cursor: pointer;
      margin: 20px;
    }
    button:hover {
      background: #ff4757;
      transform: scale(1.1);
    }
  </style>
</head>
<body>
  <h1>Hai Kaede! 🐾</h1>
  <p style="font-size:1.5em;">Selamat datang di dunia lucu kamu~</p>

  <div class="message">
    <h2>Say Hi buat Kaede 💕</h2>
    <button onclick="sayHi()">Klik buat Say Hi!</button>
    <p id="greeting" style="font-size:1.4em; min-height:50px;"></p>
  </div>

  <h2>Gambar-Gambar Lucu buat Kaede 😆</h2>
  <div class="gallery">
    <img src="https://picsum.photos/id/237/400/300" alt="Anjing lucu">
    <img src="https://picsum.photos/id/1015/400/300" alt="Kucing meme">
    <img src="https://picsum.photos/id/201/400/300" alt="Panda">
    <img src="https://picsum.photos/id/133/400/300" alt="Lucu banget">
    <img src="https://picsum.photos/id/251/400/300" alt="Meme cat">
    <img src="https://picsum.photos/id/180/400/300" alt="Binatang lucu">
  </div>

  <footer style="margin-top:50px; font-size:1.1em;">
    Made with ❤️ buat Kaede<br>
    Refresh kalau mau gambar baru!
  </footer>

  <script>
    function sayHi() {
      const greetings = [
        "Hai Kaede! Kamu lucu banget hari ini 🥰",
        "Kaede the best! 💖",
        "Semangat ya Kaede-chan! ✨",
        "Hihihi Kaede imut banget~",
        "Love you Kaede 💕",
        "Kaede no.1 di dunia ini! 👑"
      ];
      const random = greetings[Math.floor(Math.random() * greetings.length)];
      document.getElementById("greeting").textContent = random;
    }

    // Auto say hi pertama kali
    setTimeout(() => {
      sayHi();
    }, 800);
  </script>
</body>
</html>
