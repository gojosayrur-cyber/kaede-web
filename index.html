<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maaf ya Kaede... 🥺</title>
  <style>
    body {
      font-family: 'Comic Sans MS', cursive, sans-serif;
      background: linear-gradient(135deg, #2b2b4f, #4a2b5c);
      color: #ffccdd;
      margin: 0;
      padding: 20px;
      text-align: center;
      min-height: 100vh;
    }
    h1 {
      font-size: 3.2em;
      color: #ff99bb;
      text-shadow: 0 0 15px #ff99bb;
      margin: 30px 0 10px;
    }
    .subtitle {
      font-size: 1.6em;
      margin-bottom: 30px;
      color: #ffbbdd;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    .message {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 25px;
      padding: 25px;
      margin: 25px auto;
      max-width: 650px;
      border: 2px solid #ff99bb;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
      margin: 40px 0;
    }
    .gallery img {
      width: 100%;
      border-radius: 20px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.4);
      transition: all 0.4s;
    }
    .gallery img:hover {
      transform: scale(1.08) rotate(-5deg);
      box-shadow: 0 15px 30px rgba(255, 153, 187, 0.4);
    }
    button {
      background: #ff99bb;
      color: #2b2b4f;
      border: none;
      padding: 16px 32px;
      font-size: 1.4em;
      border-radius: 50px;
      cursor: pointer;
      margin: 15px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }
    button:hover {
      background: #ffbbdd;
      transform: scale(1.1);
    }
    #response {
      font-size: 1.5em;
      min-height: 80px;
      margin: 20px;
      color: #ffeecc;
    }
    footer {
      margin-top: 50px;
      font-size: 1.2em;
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Kaede... 🥺</h1>
    <p class="subtitle">Maaf ya kalau aku bikin kamu ngambek...</p>

    <div class="message">
      <h2>Aku kangen Kaede yang ceria 💕</h2>
      <p style="font-size:1.3em;">Kamu imut banget pas lagi senyum, jangan marah dong...</p>
    </div>

    <button onclick="cheerUp()">Peluk Virtual 🤗</button>
    <button onclick="saySorry()">Minta Maaf</button>
    <button onclick="makeSmile()">Bikin Kamu Senyum</button>

    <p id="response"></p>

    <h2>Gambar buat ngenan hati Kaede 🐱💔</h2>
    <div class="gallery">
      <img src="https://picsum.photos/id/1015/400/300" alt="Kucing sedih imut">
      <img src="https://picsum.photos/id/201/400/300" alt="Peluk">
      <img src="https://picsum.photos/id/237/400/300" alt="Anjing sedih">
      <img src="https://picsum.photos/id/669/400/300" alt="Cute sad">
      <img src="https://picsum.photos/id/180/400/300" alt="Binatang lucu">
      <img src="https://picsum.photos/id/251/400/300" alt="Meme sedih">
    </div>

    <footer>
      Aku sayang Kaede banget ❤️<br>
      Maaf ya... Jangan ngambek lama-lama dong 🥹
    </footer>
  </div>

  <script>
    const messages = [
      "Maaf ya Kaede... Aku nggak mau liat kamu sedih 🥺",
      "Peluk aku dulu dong, biar nggak ngambek lagi 🤗",
      "Kaede paling imut di dunia ini, jangan marah ya 💕",
      "Aku janji bakal bikin kamu senyum lagi hari ini ✨",
      "Hati aku ikut sakit kalau Kaede ngambek... 🥹",
      "Cieee Kaede yang lagi ngambek, gemes banget sih 😘"
    ];

    function cheerUp() {
      document.getElementById("response").innerHTML = "🤗🤗🤗<br><b>Peluk erat buat Kaede!</b>";
      createHearts();
    }

    function saySorry() {
      const random = messages[Math.floor(Math.random() * messages.length)];
      document.getElementById("response").innerHTML = random;
    }

    function makeSmile() {
      document.getElementById("response").innerHTML = "😺💕<br><b>Senyum dong Kaede... liat ini!</b>";
      createHearts();
    }

    function createHearts() {
      for (let i = 0; i < 15; i++) {
        const heart = document.createElement("div");
        heart.textContent = "💕";
        heart.style.position = "fixed";
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.top = "100vh";
        heart.style.fontSize = "2em";
        heart.style.zIndex = "999";
        heart.style.transition = "all 3s";
        document.body.appendChild(heart);
        
        setTimeout(() => {
          heart.style.top = "-50px";
          heart.style.opacity = "0";
        }, 100);
        
        setTimeout(() => heart.remove(), 4000);
      }
    }

    // Auto message pertama
    setTimeout(() => {
      saySorry();
    }, 1200);
  </script>
</body>
</html>
